[package]
name = "thornhill"
version = "0.1.0"
edition = "2021"
authors = ["Enyxma OS Contributors"]
description = "Ambient cognitive backbone: sensory tap, causal graph, dual-mind reflex engine"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
ulid = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
# RFC-001 §6: Nedensellik grafiği deposu ("bundled": Nix sandbox uyumlu)
rusqlite = { version = "0.32", features = ["bundled"] }
# RFC-001 §9.2: S2 LLM çağrıları (Ollama uyumlu /api/generate)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "thornhilld"
path = "src/bin/thornhilld.rs"

[[bin]]
name = "thornhill-ctl"
path = "src/bin/thornhill_ctl.rs"

[lib]
name = "thornhill"
path = "src/lib.rs"
